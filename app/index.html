<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G2 Peak View</title>
    <style>
      body { background: #111; color: #9f9; font: 13px/1.4 ui-monospace, Menlo, monospace; margin: 12px; }
      #preview { image-rendering: pixelated; width: 100%; max-width: 1152px; background: #000; display: block; }
      #screen { white-space: pre-wrap; }
      .keys button { font: inherit; margin: 4px 4px 4px 0; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <canvas id="preview" width="576" height="288"></canvas>
    <div class="keys">
      <button data-key="up">↑ swipe</button>
      <button data-key="down">↓ swipe</button>
      <button data-key="tap">tap</button>
      <button data-key="fov">画角</button>
      <button data-key="pitch">上下追従</button>
      <button data-key="diag">診断</button>
      <label>pitch <input id="pitch" type="range" min="-20" max="20" step="0.5" value="0" /></label>
    </div>
    <pre id="screen">起動中…</pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
